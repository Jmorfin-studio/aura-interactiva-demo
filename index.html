<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aura Interactiva - Test PING-PONG</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #121212; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        #avatar-container { display: none; } /* Ocultamos el avatar para esta prueba */
        #controls-overlay { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; }
        #mic-button { background-color: #4285F4; width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer; }
        #mic-button:disabled { background-color: #999; }
        #status { font-size: 16px; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; }
    </style>
</head>
<body>
    <div id="avatar-container"></div>
    <div id="controls-overlay">
        <button id="mic-button">🎤</button>
        <div id="status">Test de Conexión PING-PONG</div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const micButton = document.getElementById('mic-button');
            const statusDiv = document.getElementById('status');
            const sessionId = new URLSearchParams(window.location.search).get('session_id');
            const BACKEND_WS_HOST = "aura-interactiva-backend.onrender.com";

            let socket;
            micButton.disabled = true;

            function connectWebSocket() {
                statusDiv.textContent = "Conectando para PING-PONG...";
                const wsUrl = `wss://${BACKEND_WS_HOST}/ws/${sessionId}`;
                socket = new WebSocket(wsUrl);

                socket.onopen = () => {
                    statusDiv.textContent = "Conectado. Presiona el micrófono para enviar PING.";
                    micButton.disabled = false;
                };

                socket.onmessage = (event) => {
                    // Ahora esperamos texto plano, no JSON
                    console.log("Respuesta del servidor (PONG):", event.data);
                    statusDiv.textContent = "Respuesta recibida: " + event.data;
                };

                socket.onclose = () => {
                    statusDiv.textContent = "Desconectado. Reintentando...";
                    micButton.disabled = true;
                    setTimeout(connectWebSocket, 3000);
                };
            }
            connectWebSocket();

            micButton.addEventListener('click', () => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    const message = "PING desde el navegador a las " + new Date().toLocaleTimeString();
                    statusDiv.textContent = "Enviando PING...";
                    socket.send(message);
                }
            });
        });
    </script>
</body>
</html>
